name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts adapters
      - run: python -m gbrain_ops.privacy_scan .
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vendor-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: python -m pip install -e .
      - name: Fetch pinned vendor revision
        run: |
          base=$(python -c 'import json; print(json.load(open("patches/gbrain/manifest.json"))["base_commit"])')
          git clone --filter=blob:none https://github.com/garrytan/gbrain.git "$RUNNER_TEMP/gbrain-vendor"
          git -C "$RUNNER_TEMP/gbrain-vendor" checkout --detach "$base"
      - run: gbrain-ops vendor-promote --vendor "$RUNNER_TEMP/gbrain-vendor" --manifest "$GITHUB_WORKSPACE/patches/gbrain/manifest.json" --output "$RUNNER_TEMP/gbrain-release"
      - name: Install promoted runtime dependencies without opening a local brain
        run: |
          cd "$RUNNER_TEMP/gbrain-release"
          PATH="$HOME/.bun/bin:/usr/bin:/bin" bun install --ignore-scripts --frozen-lockfile
      - name: Verify promoted runtime
        run: |
          cd "$RUNNER_TEMP/gbrain-release"
          bun run typecheck
          bun test \
            test/pglite-lock.test.ts \
            test/ingestion/service.test.ts \
            test/ingestion/sources/command-archive.test.ts \
            test/ingestion/http-owner-vertical-slice.serial.test.ts \
            test/serve-http-owner-lifecycle.test.ts \
            test/serve-http-startup-failure.serial.test.ts
          test -z "$(git status --porcelain)"

  pre-merge:
    if: ${{ always() }}
    needs: [ops, vendor-compat]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI job to pass
        env:
          OPS_RESULT: ${{ needs.ops.result }}
          VENDOR_COMPAT_RESULT: ${{ needs.vendor-compat.result }}
        run: |
          failed=0
          for check in "ops=$OPS_RESULT" "vendor-compat=$VENDOR_COMPAT_RESULT"; do
            name=${check%%=*}
            result=${check#*=}
            printf '%s: %s\n' "$name" "$result"
            if [ "$result" != success ]; then
              failed=1
            fi
          done
          exit "$failed"
